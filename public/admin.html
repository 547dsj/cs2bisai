<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;400;500;600;700&family=Orbitron:wght@500;600;700;800&display=swap" rel="stylesheet">
    <title>CS2 赛事全景 · 暗黑电竞看板</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js">
    </script>
    <script src="/static/config.js"></script>
    <style>
        /* ============================================================
           CS2 EVENT ARCHIVE — CINEMATIC GLASS DESIGN SYSTEM
           style: glassmorphism · palette: esports neon on near-black
           type: Orbitron (display) + Exo 2 (body)
           ============================================================ */
        :root {
            --bg: #05060c;
            --bg-raise: #0a0d17;
            --glass: rgba(255, 255, 255, 0.035);
            --glass-strong: rgba(255, 255, 255, 0.07);
            --stroke: rgba(255, 255, 255, 0.10);
            --stroke-soft: rgba(255, 255, 255, 0.06);
            --text: #e9eff8;
            --text-dim: #9aa6bb;
            --text-faint: #6b7690;
            --cyan: #5bc8ff;
            --cyan-deep: #1d4d66;
            --violet: #8f6bff;
            --amber: #f2c879;
            --rose: #ff5d73;
            --radius-lg: 22px;
            --radius-md: 16px;
            --radius-sm: 10px;
            --font-display: 'Orbitron', 'Segoe UI', sans-serif;
            --font-body: 'Exo 2', 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif;
            --ease-out: cubic-bezier(0.22, 0.61, 0.36, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: var(--font-body);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: var(--bg);
            color: var(--text);
            color-scheme: dark;
            min-height: 100vh;
            padding: 28px 20px 40px;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        /* ---------- ambient background scene ---------- */
        .bg-scene {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }
        .bg-scene .aura {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.55;
            animation: aura-drift 26s ease-in-out infinite alternate;
        }
        .bg-scene .aura-a {
            width: 640px;
            height: 640px;
            left: -220px;
            top: -240px;
            background: radial-gradient(circle, rgba(43, 132, 196, 0.20), transparent 62%);
        }
        .bg-scene .aura-b {
            width: 720px;
            height: 720px;
            right: -260px;
            top: 16%;
            background: radial-gradient(circle, rgba(116, 78, 255, 0.16), transparent 62%);
            animation-delay: -9s;
        }
        .bg-scene .aura-c {
            width: 520px;
            height: 520px;
            left: 22%;
            bottom: -260px;
            background: radial-gradient(circle, rgba(242, 200, 121, 0.08), transparent 62%);
            animation-delay: -16s;
        }
        .bg-scene .grid {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.028) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.028) 1px, transparent 1px);
            background-size: 56px 56px;
            mask-image: radial-gradient(ellipse 90% 70% at 50% 0%, #000 20%, transparent 75%);
            -webkit-mask-image: radial-gradient(ellipse 90% 70% at 50% 0%, #000 20%, transparent 75%);
        }
        @keyframes aura-drift {
            from { transform: translate3d(0, 0, 0) scale(1); }
            to   { transform: translate3d(40px, 28px, 0) scale(1.08); }
        }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.03); }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, rgba(91, 200, 255, 0.55), rgba(143, 107, 255, 0.55));
            border-radius: 8px;
        }
        ::-webkit-scrollbar-thumb:hover { background: rgba(91, 200, 255, 0.8); }

        ::selection { background: rgba(91, 200, 255, 0.28); color: #fff; }

        :focus-visible {
            outline: 2px solid var(--cyan);
            outline-offset: 2px;
            border-radius: 4px;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1480px;
            margin: 0 auto;
        }

        /* ---------- hero header ---------- */
        .main-header {
            position: relative;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 18px;
            padding: 42px 46px 38px;
            margin-bottom: 34px;
            background: linear-gradient(160deg, rgba(255, 255, 255, 0.055), rgba(255, 255, 255, 0.015) 55%, rgba(91, 200, 255, 0.04));
            border: 1px solid var(--stroke);
            border-radius: 26px;
            backdrop-filter: blur(18px) saturate(1.25);
            -webkit-backdrop-filter: blur(18px) saturate(1.25);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.08);
            overflow: hidden;
        }
        .main-header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(91, 200, 255, 0.7), rgba(143, 107, 255, 0.5), transparent);
        }
        .main-header::after {
            content: '';
            position: absolute;
            right: -90px;
            top: -110px;
            width: 340px;
            height: 340px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(91, 200, 255, 0.13), transparent 65%);
            pointer-events: none;
        }
        .hero { position: relative; z-index: 1; }
        .hero-kicker {
            font-family: var(--font-display);
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.42em;
            text-transform: uppercase;
            color: var(--cyan);
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .hero-kicker::before {
            content: '';
            width: 34px;
            height: 1px;
            background: linear-gradient(90deg, var(--cyan), transparent);
        }
        .hero h1 {
            font-family: var(--font-display);
            font-size: clamp(38px, 6vw, 64px);
            font-weight: 800;
            letter-spacing: 0.06em;
            line-height: 1.05;
            color: #f4f8ff;
            text-transform: uppercase;
            text-shadow: 0 0 46px rgba(91, 200, 255, 0.25);
        }
        .hero h1 .hero-grad {
            background: linear-gradient(100deg, #8fd7ff 0%, var(--cyan) 38%, var(--violet) 78%, #c4b0ff 100%);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-size: 200% 100%;
            animation: grad-shift 9s ease-in-out infinite alternate;
        }
        @keyframes grad-shift {
            from { background-position: 0% 50%; }
            to   { background-position: 100% 50%; }
        }
        .main-header .sub {
            margin-top: 16px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            letter-spacing: 0.08em;
            color: var(--text-dim);
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--stroke-soft);
            padding: 8px 18px;
            border-radius: 999px;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        .main-header .sub span {
            font-family: var(--font-display);
            font-size: 12px;
            color: var(--amber);
            letter-spacing: 0.06em;
        }
        .sub-edit-btn {
            margin-left: 8px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--stroke);
            color: var(--text-dim);
            padding: 4px 14px;
            border-radius: 999px;
            cursor: pointer;
            font-size: 12px;
            transition: 0.2s ease;
        }
        .sub-edit-btn:hover { border-color: var(--cyan); color: #fff; }

        /* ---------- year selector ---------- */
        .year-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-bottom: 26px;
        }
        .year-btn {
            min-height: 44px;
            padding: 10px 26px;
            font-family: var(--font-display);
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.12em;
            color: var(--text-dim);
            background: var(--glass);
            border: 1px solid var(--stroke-soft);
            border-radius: 999px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: all 0.25s var(--ease-out);
        }
        .year-btn:hover {
            color: #fff;
            border-color: rgba(91, 200, 255, 0.55);
            box-shadow: 0 0 24px rgba(91, 200, 255, 0.18);
            transform: translateY(-2px);
        }
        .year-btn.active {
            color: #04121c;
            background: linear-gradient(135deg, #7ed8ff, var(--cyan));
            border-color: transparent;
            box-shadow: 0 8px 28px rgba(91, 200, 255, 0.35);
        }

        /* ---------- stat cards ---------- */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 26px;
        }
        .stat-card {
            position: relative;
            padding: 22px 22px 20px;
            background: linear-gradient(170deg, var(--glass-strong), var(--glass));
            border: 1px solid var(--stroke-soft);
            border-radius: var(--radius-md);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            overflow: hidden;
            transition: transform 0.3s var(--ease-out), border-color 0.3s ease, box-shadow 0.3s ease;
        }
        .stat-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, var(--cyan), transparent 70%);
            opacity: 0.75;
        }
        .stat-card:nth-child(2)::before { background: linear-gradient(90deg, var(--amber), transparent 70%); }
        .stat-card:nth-child(3)::before { background: linear-gradient(90deg, var(--violet), transparent 70%); }
        .stat-card:nth-child(4)::before { background: linear-gradient(90deg, #6ee7b7, transparent 70%); }
        .stat-card:hover {
            transform: translateY(-4px);
            border-color: rgba(91, 200, 255, 0.35);
            box-shadow: 0 18px 44px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(91, 200, 255, 0.12);
        }
        .stat-card .label {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.24em;
            color: var(--text-faint);
        }
        .stat-card .value {
            margin-top: 10px;
            font-family: var(--font-display);
            font-size: 34px;
            font-weight: 700;
            letter-spacing: 0.02em;
            color: #f2f7ff;
            display: flex;
            align-items: baseline;
            gap: 6px;
        }
        .stat-card .value .unit {
            font-family: var(--font-body);
            font-size: 13px;
            font-weight: 400;
            letter-spacing: 0.08em;
            color: var(--text-faint);
        }

        /* ---------- triple panel ---------- */
        .triple-panel {
            display: grid;
            grid-template-columns: 1fr 1.5fr 1.2fr;
            gap: 18px;
            margin-bottom: 26px;
        }
        @media (max-width: 1000px) {
            .triple-panel { grid-template-columns: 1fr 1fr; }
            .triple-panel .panel:last-child { grid-column: span 2; }
        }
        @media (max-width: 700px) {
            .triple-panel { grid-template-columns: 1fr; }
            .triple-panel .panel:last-child { grid-column: 1; }
        }
        .panel {
            padding: 22px 22px 24px;
            background: linear-gradient(170deg, var(--glass-strong), var(--glass));
            border: 1px solid var(--stroke-soft);
            border-radius: var(--radius-lg);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            box-shadow: 0 16px 44px rgba(0, 0, 0, 0.38), inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }
        .panel h3 {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            font-family: var(--font-display);
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--text-dim);
            margin-bottom: 16px;
            padding-bottom: 14px;
            border-bottom: 1px solid var(--stroke-soft);
        }
        .panel h3 svg { width: 16px; height: 16px; stroke: var(--cyan); flex: none; }
        .panel:nth-child(3) h3 svg { stroke: var(--amber); }
        .panel h3 i {
            font-style: normal;
            font-family: var(--font-body);
            font-size: 11px;
            letter-spacing: 0.1em;
            color: var(--text-faint);
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--stroke-soft);
            padding: 3px 10px;
            border-radius: 999px;
        }
        .panel h3 .timeline-toggle {
            margin-left: auto;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--stroke);
            color: var(--text-dim);
            padding: 7px 18px;
            border-radius: 999px;
            font-size: 12px;
            letter-spacing: 0.06em;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .panel h3 .timeline-toggle:hover {
            border-color: rgba(91, 200, 255, 0.6);
            color: #fff;
            box-shadow: 0 0 18px rgba(91, 200, 255, 0.15);
        }
        .mvp-list, .champion-list, .timeline {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 370px;
            overflow-y: auto;
            padding-right: 6px;
        }
        .mvp-item, .champion-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.028);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-left: 2px solid var(--cyan);
            border-radius: 12px;
            transition: all 0.22s ease;
        }
        .mvp-item:hover, .champion-item:hover {
            background: rgba(91, 200, 255, 0.07);
            border-color: rgba(91, 200, 255, 0.28);
            transform: translateX(3px);
        }
        .champion-item {
            border-left-color: var(--violet);
            flex-wrap: wrap;
        }
        .champion-item:hover { background: rgba(143, 107, 255, 0.07); border-color: rgba(143, 107, 255, 0.3); }
        .mvp-item .name, .champion-item .name {
            font-weight: 500;
            letter-spacing: 0.04em;
        }
        .mvp-item .count, .champion-item .count {
            font-family: var(--font-display);
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.08em;
            color: var(--cyan);
            background: rgba(91, 200, 255, 0.1);
            border: 1px solid rgba(91, 200, 255, 0.22);
            padding: 3px 14px;
            border-radius: 999px;
            white-space: nowrap;
        }
        .champion-item .count { color: #c9b8ff; background: rgba(143, 107, 255, 0.12); border-color: rgba(143, 107, 255, 0.28); }
        .mvp-item .mvp-left { display: flex; align-items: center; gap: 10px; }
        .mvp-item .medal {
            font-family: var(--font-display);
            font-size: 12px;
            font-weight: 700;
            width: 30px;
            height: 30px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            color: #04121c;
            background: linear-gradient(135deg, #ffe9a8, #f2c879);
            box-shadow: 0 0 16px rgba(242, 200, 121, 0.35);
        }
        .mvp-item .medal.r2 { background: linear-gradient(135deg, #e8edf5, #9fb2c8); box-shadow: 0 0 16px rgba(160, 180, 205, 0.3); }
        .mvp-item .medal.r3 { background: linear-gradient(135deg, #ffcfa3, #d99b62); box-shadow: 0 0 16px rgba(217, 155, 98, 0.3); }
        .mvp-item .medal.r { color: var(--text-dim); background: rgba(255, 255, 255, 0.08); box-shadow: none; }
        .champion-item .expand-btn-sm {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--stroke);
            color: var(--text-dim);
            border-radius: 50%;
            width: 26px;
            height: 26px;
            font-size: 11px;
            cursor: pointer;
            transition: 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .champion-item .expand-btn-sm:hover {
            border-color: rgba(143, 107, 255, 0.6);
            color: #fff;
            box-shadow: 0 0 14px rgba(143, 107, 255, 0.25);
        }
        .champion-detail {
            width: 100%;
            padding: 8px 14px 8px 16px;
            font-size: 13px;
            color: var(--text-dim);
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid var(--stroke-soft);
            border-radius: 10px;
            margin-top: 2px;
            display: none;
            list-style: none;
        }
        .champion-detail li {
            padding: 5px 0;
            border-bottom: 1px dashed rgba(255, 255, 255, 0.06);
        }
        .champion-detail li:last-child { border-bottom: none; }
        .champion-detail .event-name { color: var(--text); }
        .champion-detail .event-date {
            font-family: var(--font-display);
            font-size: 11px;
            color: var(--text-faint);
            margin-left: 10px;
            letter-spacing: 0.06em;
        }

        /* ---------- timeline ---------- */
        .tl-item {
            display: flex;
            align-items: center;
            gap: 14px;
            font-size: 14px;
            padding: 9px 12px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.025);
            border: 1px solid rgba(255, 255, 255, 0.045);
            transition: all 0.22s ease;
        }
        .tl-item:hover {
            background: rgba(91, 200, 255, 0.06);
            border-color: rgba(91, 200, 255, 0.22);
        }
        .tl-item .date {
            font-family: var(--font-display);
            font-size: 12px;
            letter-spacing: 0.04em;
            color: var(--text-faint);
            min-width: 82px;
            flex: none;
        }
        .tl-item .event { color: var(--text); font-weight: 500; }
        .tl-item .badge {
            font-size: 10px;
            letter-spacing: 0.08em;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--stroke-soft);
            padding: 2px 12px;
            border-radius: 999px;
            color: var(--text-dim);
            margin-left: auto;
            white-space: nowrap;
        }
        .tl-item .badge.major {
            color: #e9dcff;
            background: rgba(143, 107, 255, 0.18);
            border-color: rgba(143, 107, 255, 0.4);
            box-shadow: 0 0 14px rgba(143, 107, 255, 0.2);
        }

        /* ---------- filter bar ---------- */
        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 14px 22px;
            padding: 16px 24px;
            margin-bottom: 24px;
            background: var(--glass);
            border: 1px solid var(--stroke-soft);
            border-radius: 18px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .filter-bar label {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--text-faint);
        }
        .filter-bar label svg { width: 14px; height: 14px; stroke: var(--text-dim); flex: none; }
        .filter-bar select,
        .filter-bar input {
            min-height: 40px;
            padding: 8px 16px;
            background: rgba(0, 0, 0, 0.35);
            color: var(--text);
            border: 1px solid var(--stroke);
            border-radius: 999px;
            font-size: 14px;
            outline: none;
            cursor: pointer;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        .filter-bar select:focus,
        .filter-bar input:focus {
            border-color: var(--cyan);
            box-shadow: 0 0 0 3px rgba(91, 200, 255, 0.14);
        }
        .filter-bar select option { background: #0b0e18; }
        .filter-bar .reset-btn {
            margin-left: auto;
            min-height: 40px;
            padding: 8px 22px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--stroke);
            color: var(--text-dim);
            border-radius: 999px;
            font-size: 13px;
            letter-spacing: 0.08em;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .filter-bar .reset-btn:hover {
            color: #fff;
            border-color: rgba(91, 200, 255, 0.5);
            box-shadow: 0 0 18px rgba(91, 200, 255, 0.15);
        }

        /* ---------- toolbar & buttons ---------- */
        .toolbar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }
        .btn {
            min-height: 44px;
            padding: 10px 22px;
            border: 1px solid var(--stroke);
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-dim);
            border-radius: 999px;
            cursor: pointer;
            font-size: 14px;
            letter-spacing: 0.06em;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: all 0.22s var(--ease-out);
        }
        .btn:hover {
            color: #fff;
            border-color: rgba(91, 200, 255, 0.55);
            transform: translateY(-2px);
            box-shadow: 0 10px 26px rgba(0, 0, 0, 0.4);
        }
        .btn-primary {
            color: #04121c;
            background: linear-gradient(135deg, #7ed8ff, var(--cyan));
            border-color: transparent;
            font-weight: 600;
            box-shadow: 0 10px 30px rgba(91, 200, 255, 0.3);
        }
        .btn-primary:hover {
            color: #04121c;
            box-shadow: 0 14px 36px rgba(91, 200, 255, 0.45);
        }
        .btn-danger {
            background: transparent;
            border-color: rgba(255, 93, 115, 0.5);
            color: #ff9fae;
        }
        .btn-danger:hover {
            color: #fff;
            border-color: var(--rose);
            box-shadow: 0 10px 28px rgba(255, 93, 115, 0.25);
        }
        .btn-danger.active {
            background: linear-gradient(135deg, #ff7d90, var(--rose));
            border-color: transparent;
            color: #1c0408;
            font-weight: 600;
            box-shadow: 0 12px 32px rgba(255, 93, 115, 0.4);
        }
        .edit-btn {
            min-height: 34px;
            padding: 6px 16px;
            background: rgba(91, 200, 255, 0.08);
            border: 1px solid rgba(91, 200, 255, 0.3);
            color: #a9e4ff;
            border-radius: 999px;
            cursor: pointer;
            font-size: 12px;
            letter-spacing: 0.06em;
            transition: all 0.2s ease;
        }
        .edit-btn:hover {
            background: rgba(91, 200, 255, 0.16);
            color: #fff;
            box-shadow: 0 0 16px rgba(91, 200, 255, 0.25);
        }
        #cancelDeleteBtn { display: none; }
        body.delete-mode #cancelDeleteBtn { display: inline-block; }
        #selectAll, .row-checkbox {
            display: none;
            width: 16px;
            height: 16px;
            accent-color: var(--cyan);
            cursor: pointer;
        }
        body.delete-mode #selectAll,
        body.delete-mode .row-checkbox { display: inline-block; }
        body.delete-mode .expand-btn { display: none; }

        /* ---------- table ---------- */
        .table-wrap {
            background: linear-gradient(170deg, var(--glass-strong), var(--glass));
            border: 1px solid var(--stroke-soft);
            border-radius: var(--radius-lg);
            padding: 6px;
            overflow-x: auto;
            margin-bottom: 24px;
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            box-shadow: 0 18px 48px rgba(0, 0, 0, 0.4);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
            min-width: 1100px;
        }
        thead th {
            position: sticky;
            top: 0;
            z-index: 2;
            text-align: left;
            padding: 14px 12px;
            font-family: var(--font-display);
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: var(--text-faint);
            background: rgba(7, 9, 16, 0.9);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--stroke);
        }
        td {
            padding: 13px 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.045);
            color: var(--text);
        }
        tr:last-child td { border-bottom: none; }
        tbody tr.main-row { transition: background 0.18s ease; }
        tbody tr.main-row:hover td { background: rgba(91, 200, 255, 0.045); }
        .expand-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--stroke);
            color: var(--text-dim);
            border-radius: 50%;
            width: 28px;
            height: 28px;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            vertical-align: middle;
        }
        .expand-btn:hover {
            border-color: var(--cyan);
            color: var(--cyan);
            box-shadow: 0 0 14px rgba(91, 200, 255, 0.25);
        }
        .detail-row { background: rgba(0, 0, 0, 0.28); }
        .detail-row td { padding: 14px 20px; border-bottom: 1px solid var(--stroke-soft); }
        .detail-row .detail-content { display: flex; flex-direction: column; gap: 10px; font-size: 14px; }
        .detail-row .detail-content .vs-line {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.04em;
        }
        .detail-row .detail-content .vs-line .team-name {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text);
        }
        .detail-row .detail-content .vs-line .team-name .tag-win,
        .detail-row .detail-content .vs-line .team-name .tag-run {
            font-family: var(--font-display);
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 0.16em;
            padding: 3px 8px;
            border-radius: 6px;
        }
        .tag-win { color: #06242f; background: var(--cyan); }
        .tag-run { color: #f3ecff; background: rgba(143, 107, 255, 0.35); }
        .detail-row .detail-content .vs-line .score {
            font-family: var(--font-display);
            font-size: 18px;
            color: var(--amber);
            letter-spacing: 0.08em;
        }
        .detail-row .detail-content .roster-block {
            display: flex;
            flex-wrap: wrap;
            gap: 10px 32px;
        }
        .detail-row .detail-content .roster-block .roster-item {
            color: var(--text-dim);
            font-size: 13px;
        }
        .detail-row .detail-content .roster-block .roster-item strong { color: var(--text); font-weight: 600; }
        .org-tag {
            display: inline-block;
            padding: 3px 12px;
            border-radius: 999px;
            font-size: 12px;
            letter-spacing: 0.05em;
            color: #a9e4ff;
            background: rgba(91, 200, 255, 0.09);
            border: 1px solid rgba(91, 200, 255, 0.24);
        }
        .level-tag {
            display: inline-block;
            padding: 3px 12px;
            border-radius: 999px;
            font-size: 12px;
            color: var(--text-dim);
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--stroke-soft);
        }
        .level-tag.major {
            color: #e9dcff;
            background: rgba(143, 107, 255, 0.18);
            border-color: rgba(143, 107, 255, 0.42);
            box-shadow: 0 0 14px rgba(143, 107, 255, 0.18);
        }
        .mvp-name { color: #8fd7ff; font-weight: 500; }
        .mvp-name.tbd { color: var(--text-faint); font-style: italic; }
        .prize {
            font-family: var(--font-display);
            font-size: 13px;
            color: var(--amber);
            letter-spacing: 0.04em;
        }
        .location { color: var(--text-dim); }
        .date-range {
            font-family: var(--font-display);
            font-size: 12px;
            color: var(--text);
            white-space: nowrap;
            letter-spacing: 0.04em;
        }

        /* ---------- charts ---------- */
        .chart-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
            margin-bottom: 18px;
        }
        @media (max-width: 860px) { .chart-grid { grid-template-columns: 1fr; } }
        .chart-box {
            padding: 22px 18px 16px;
            background: linear-gradient(170deg, var(--glass-strong), var(--glass));
            border: 1px solid var(--stroke-soft);
            border-radius: var(--radius-lg);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            box-shadow: 0 16px 44px rgba(0, 0, 0, 0.35);
        }
        .chart-box h4 {
            font-family: var(--font-display);
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--text-dim);
            margin-bottom: 14px;
            text-align: center;
        }
        .chart-box canvas { max-height: 240px; max-width: 100%; }

        .footer {
            text-align: center;
            color: var(--text-faint);
            font-size: 12px;
            letter-spacing: 0.22em;
            padding: 22px 0 4px;
            border-top: 1px solid var(--stroke-soft);
            margin-top: 18px;
            text-transform: uppercase;
        }
        .text-muted { color: var(--text-faint); }

        body.readonly .toolbar { display: none; }
        body.readonly .actions, body.readonly th:last-child { display: none; }
        body.readonly .edit-btn { display: none; }

        /* ---------- modal ---------- */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 200;
            background: rgba(3, 4, 9, 0.72);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-card {
            width: min(760px, 100%);
            max-height: 90vh;
            overflow: auto;
            background: linear-gradient(170deg, rgba(22, 26, 40, 0.92), rgba(10, 12, 22, 0.96));
            border: 1px solid var(--stroke);
            border-radius: var(--radius-lg);
            box-shadow: 0 40px 120px rgba(0, 0, 0, 0.75), inset 0 1px 0 rgba(255, 255, 255, 0.08);
            padding: 26px;
        }
        .modal-card.small { width: min(420px, 100%); }
        .modal-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 14px;
            border-bottom: 1px solid var(--stroke-soft);
        }
        .modal-head h2 {
            font-family: var(--font-display);
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 0.1em;
            color: var(--text);
            text-transform: uppercase;
        }
        .modal-close {
            background: transparent;
            border: none;
            color: var(--text-faint);
            font-size: 26px;
            line-height: 1;
            cursor: pointer;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            transition: all 0.2s ease;
        }
        .modal-close:hover { color: #fff; background: rgba(255, 255, 255, 0.06); }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        .form-grid .full { grid-column: span 2; }
        @media (max-width: 640px) {
            .form-grid { grid-template-columns: 1fr; }
            .form-grid .full { grid-column: 1; }
        }
        .form-field label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--text-dim);
            margin-bottom: 8px;
        }
        .form-field input,
        .form-field select {
            width: 100%;
            min-height: 44px;
            padding: 10px 14px;
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid var(--stroke);
            border-radius: var(--radius-sm);
            color: var(--text);
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        .form-field input:focus,
        .form-field select:focus {
            border-color: var(--cyan);
            box-shadow: 0 0 0 3px rgba(91, 200, 255, 0.14);
        }
        .form-field select option { background: #0b0e18; }
        .form-field .hint {
            display: block;
            font-size: 12px;
            color: var(--text-faint);
            margin-top: 6px;
        }
        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 24px;
        }

        /* ---------- admin login ---------- */
        .login-overlay {
            position: fixed;
            inset: 0;
            z-index: 300;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background:
                radial-gradient(ellipse 80% 60% at 50% 0%, rgba(91, 200, 255, 0.08), transparent 60%),
                rgba(4, 5, 10, 0.86);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }
        .login-overlay.hidden { display: none; }
        .login-card {
            width: min(420px, 100%);
            padding: 40px 36px 34px;
            text-align: center;
            background: linear-gradient(170deg, rgba(24, 28, 44, 0.9), rgba(9, 11, 20, 0.95));
            border: 1px solid var(--stroke);
            border-radius: 24px;
            box-shadow: 0 40px 110px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }
        .login-mark {
            width: 64px;
            height: 64px;
            margin: 0 auto 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 18px;
            background: linear-gradient(135deg, rgba(91, 200, 255, 0.16), rgba(143, 107, 255, 0.16));
            border: 1px solid rgba(91, 200, 255, 0.35);
            box-shadow: 0 0 34px rgba(91, 200, 255, 0.25);
        }
        .login-mark svg { width: 26px; height: 26px; stroke: var(--cyan); }
        .login-kicker {
            font-family: var(--font-display);
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.42em;
            color: var(--rose);
            margin-bottom: 10px;
        }
        .login-card h2 {
            font-family: var(--font-display);
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 0.08em;
            color: var(--text);
            margin-bottom: 24px;
            text-transform: uppercase;
        }
        .login-card input {
            width: 100%;
            min-height: 48px;
            padding: 10px 18px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--stroke);
            border-radius: 14px;
            color: var(--text);
            font-size: 15px;
            letter-spacing: 0.12em;
            outline: none;
            text-align: center;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        .login-card input:focus {
            border-color: var(--cyan);
            box-shadow: 0 0 0 3px rgba(91, 200, 255, 0.14);
        }
        .login-card input::placeholder { color: var(--text-faint); letter-spacing: 0.08em; }
        .login-error {
            color: #ff9fae;
            font-size: 13px;
            min-height: 20px;
            margin: 12px 0 4px;
        }
        .login-card .btn { width: 100%; margin-top: 8px; }

        /* ---------- entrance motion ---------- */
        .main-header, .year-bar, .stats-grid, .triple-panel, .filter-bar, .toolbar, .table-wrap, .chart-grid {
            animation: rise-in 0.8s var(--ease-out) both;
        }
        .year-bar { animation-delay: 0.08s; }
        .stats-grid { animation-delay: 0.16s; }
        .triple-panel { animation-delay: 0.24s; }
        .filter-bar { animation-delay: 0.3s; }
        .toolbar { animation-delay: 0.34s; }
        .table-wrap { animation-delay: 0.38s; }
        .chart-grid { animation-delay: 0.44s; }
        @keyframes rise-in {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: none; }
        }

        /* ---------- small screens ---------- */
        @media (max-width: 640px) {
            body { padding: 16px 12px 32px; }
            .main-header { padding: 30px 22px 26px; border-radius: 20px; }
            .hero h1 { font-size: 34px; }
            .filter-bar { gap: 12px; padding: 14px 16px; }
            .filter-bar .reset-btn { margin-left: 0; width: 100%; }
            .filter-bar label { width: 100%; justify-content: space-between; }
            .filter-bar select, .filter-bar input { flex: 1; }
            .stat-card .value { font-size: 28px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.001s !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.001s !important;
            }
        }
    </style>
</head>
<body>
<div class="bg-scene" aria-hidden="true">
    <div class="aura aura-a"></div>
    <div class="aura aura-b"></div>
    <div class="aura aura-c"></div>
    <div class="grid"></div>
</div>
<div class="login-overlay" id="loginOverlay">
    <div class="login-card">
        <div class="login-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></svg></div>
        <div class="login-kicker">Restricted Area</div>
        <h2>管理员登录</h2>
        <input type="password" id="loginPassword" placeholder="输入访问密码" autocomplete="current-password">
        <div class="login-error" id="loginError"></div>
        <button type="button" class="btn btn-primary" id="loginBtn">进入控制台</button>
    </div>
</div>
<div class="container">
    <header class="main-header">
        <div class="hero">
            <div class="hero-kicker">CS2 Competitive Archive</div>
            <h1>CS2 <span class="hero-grad">赛事全景</span></h1>
            <div class="sub">S级赛事 &amp; Major · 最后修改时间 <span id="lastModified">--</span></div>
        </div>
    </header>
    <div class="year-bar" id="yearBar"></div>
    <div class="stats-grid" id="statsGrid"></div>
    <!-- 三栏面板 -->
    <div class="triple-panel">
        <!-- MVP榜 -->
        <div class="panel">
            <h3><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l2.9 6.2 6.6.8-4.9 4.6 1.3 6.5L12 16.9 6.1 20.1l1.3-6.5L2.5 9l6.6-.8L12 2z"/></svg> MVP 荣誉榜 <i>次数</i></h3>
            <div class="mvp-list" id="mvpList"></div>
        </div>
        <!-- 时间线 -->
        <div class="panel">
            <h3>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg> 赛事时间线 <i>正序</i>
                <button class="timeline-toggle" id="timelineToggle">切换倒序</button>
            </h3>
            <div class="timeline" id="timeline"></div>
        </div>
        <!-- 夺冠队伍榜 -->
        <div class="panel">
            <h3><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 0112 0c0 5 2 6 2 6H4s2-1 2-6z"/><path d="M10 20a2 2 0 004 0"/></svg> 夺冠队伍榜 <i>次数</i></h3>
            <div class="champion-list" id="championList"></div>
        </div>
    </div>
    <!-- 筛选器 -->
    <div class="filter-bar">
        <label><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M5 21V7l7-4 7 4v14M9 9h1M9 13h1M14 9h1M14 13h1"/></svg> 主办方
            <select id="orgFilter"><option value="all">全部</option></select>
        </label>
        <label><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg> 赛事级别
            <select id="levelFilter"><option value="all">全部</option></select>
        </label>
        <label><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg> 时间
            <select id="monthFilter"><option value="all">全部月份</option></select>
        </label>
        <button class="reset-btn" id="resetFilters">重置筛选</button>
    </div>
        <div class="toolbar">
        <button class="btn btn-primary" id="addBtn">＋ 添加比赛</button>
        <button class="btn btn-danger" id="deleteBtn">删除比赛</button>
        <button class="btn" id="cancelDeleteBtn">取消删除</button>
    </div>

    <!-- 表格 -->
    <div class="table-wrap">
        <table>
                        <thead>
            <tr>
                <th style="width:50px;"><input type="checkbox" id="selectAll" title="全选"></th>
                <th>赛事名称</th>
                <th>举办方</th>
                <th>级别</th>
                <th>日期</th>
                <th>地点</th>
                <th>奖金</th>
                <th>冠军</th>
                <th>MVP</th>
                <th style="width:90px;">操作</th>
            </tr>
            </thead>

            <tbody id="tableBody"></tbody>
        </table>
    </div>
    <!-- 图表 -->
    <div class="chart-grid">
        <div class="chart-box">
            <h4>MVP 次数排行</h4>
            <canvas id="mvpChart"></canvas>
        </div>
        <div class="chart-box">
            <h4>各举办方总奖金</h4>
            <canvas id="orgPrizeChart"></canvas>
        </div>
    </div>
    <div class="footer">CS2 Event Archive · S级 &amp; Major · 数据持续更新</div>
</div>

<div class="modal" id="eventModal">
        <div class="modal-card" id="modalOverlay">
            <div class="modal-head">
                <h2 id="modalTitle">添加比赛</h2>
                <button type="button" class="modal-close" id="cancelBtn">&times;</button>
            </div>
            <form id="eventForm">
                <input type="hidden" id="eventId">
                <div class="form-grid">
                    <div class="form-field full">
                        <label>赛事名称 *</label>
                        <input type="text" id="name" required>
                    </div>
                    <div class="form-field">
                        <label>举办方 *</label>
                        <select id="org" required>
                        <option value="" disabled selected>请选择主办方</option>
                        <option value="ESL">ESL</option>
                        <option value="EWC">EWC</option>
                        <option value="BLAST">BLAST</option>
                        <option value="FISSURE">FISSURE</option>
                        <option value="PGL">PGL</option>
                        <option value="StarLadder">StarLadder</option>
                        <option value="完美世界">完美世界</option>
                        <option value="其他">其他</option>
                    </select>
                    </div>
                    <div class="form-field">
                        <label>赛事级别 *</label>
                        <input type="text" id="level" list="levelOptions" required>
                        <datalist id="levelOptions">
                            <option value="S级"></option>
                            <option value="S级(Major)"></option>
                            <option value="A级"></option>
                        </datalist>
                    </div>
                    <div class="form-field">
                        <label>开始日期 *</label>
                        <input type="date" id="start_date" required>
                    </div>
                    <div class="form-field">
                        <label>结束日期 *</label>
                        <input type="date" id="end_date" required>
                    </div>
                    <div class="form-field full">
                        <label>地点 *</label>
                        <input type="text" id="location" required>
                    </div>
                    <div class="form-field">
                        <label>总奖金（美元）*</label>
                        <input type="number" id="prize" min="0" step="1" required>
                    </div>
                    <div class="form-field">
                        <label>比分</label>
                        <input type="text" id="score" placeholder="例如：3-1">
                    </div>
                    <div class="form-field">
                        <label>冠军</label>
                        <input type="text" id="champion" placeholder="待定">
                    </div>
                    <div class="form-field">
                        <label>亚军</label>
                        <input type="text" id="runnerup" placeholder="待定">
                    </div>
                    <div class="form-field">
                        <label>MVP</label>
                        <input type="text" id="mvp" placeholder="待定">
                    </div>
                    <div class="form-field full">
                        <label>冠军阵容（逗号分隔）</label>
                        <input type="text" id="champion_roster" placeholder="player1, player2, player3">
                        <span class="hint">留空表示暂无阵容</span>
                    </div>
                    <div class="form-field full">
                        <label>亚军阵容（逗号分隔）</label>
                        <input type="text" id="runnerup_roster" placeholder="player1, player2, player3">
                        <span class="hint">留空表示暂无阵容</span>
                    </div>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn" id="cancelBtn2">取消</button>
                    <button type="submit" class="btn btn-primary">保存</button>
                </div>
            </form>
        </div>
    </div>


    <script>
    const API_BASE = window.APP_API_BASE || '';
    const ORG_OPTIONS = ['ESL', 'EWC', 'BLAST', 'FISSURE', 'PGL', 'StarLadder', '完美世界', '其他'];

    let eventsData = [];
    let filteredData = [];
    let timelineOrder = 'asc';
    let selectedYear = new Date().getFullYear();
    let lastModified = '--';
    let deleteMode = false;
    let selectedIds = new Set();
    let editingId = null;
    let mvpChartInstance = null;
    let orgChartInstance = null;

    const orgFilter = document.getElementById('orgFilter');
    const levelFilter = document.getElementById('levelFilter');
    const monthFilter = document.getElementById('monthFilter');
    const tableBody = document.getElementById('tableBody');
    const selectAll = document.getElementById('selectAll');

    function formatDate(d) {
        if (!d) return '';
        const parts = String(d).split('-');
        if (parts.length < 3) return String(d);
        return `${parts[0]}.${parts[1]}.${parts[2]}`;
    }

    function formatDateRange(e) {
        if (!e.start_date || !e.end_date) return formatDate(e.date || e.start_date);
        return `${formatDate(e.start_date)} – ${formatDate(e.end_date)}`;
    }

    function formatPrize(p) {
        if (p >= 1000000) return (p / 1000000).toFixed(1) + 'M';
        if (p >= 1000) return (p / 1000).toFixed(0) + 'K';
        return p;
    }

    function isTBD(val) {
        return val === '待定' || val === 'TBD' || val === null || val === undefined || val === '';
    }

    async function fetchEvents() {
        const res = await fetch(`${API_BASE}/api/events`);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        return data.map(e => ({
            ...e,
            date: e.start_date,
            org: ORG_OPTIONS.includes(e.org) ? e.org : '其他'
        }));
    }

    async function fetchLastModified() {
        const res = await fetch(`${API_BASE}/api/settings`);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        return data.last_modified || '--';
    }

    async function refreshLastModified() {
        try {
            lastModified = await fetchLastModified();
        } catch (e) {
            lastModified = '--';
        }
        const el = document.getElementById('lastModified');
        if (el) el.textContent = lastModified;
    }

    async function createEvent(payload) {
        const res = await fetch(`${API_BASE}/api/events`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
            credentials: 'include'
        });
        if (!res.ok) throw new Error(await res.text());
        return res.json();
    }

    async function updateEvent(id, payload) {
        const res = await fetch(`${API_BASE}/api/events/${id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
            credentials: 'include'
        });
        if (!res.ok) throw new Error(await res.text());
        return res.json();
    }

    async function deleteEvent(id) {
        const res = await fetch(`${API_BASE}/api/events/${id}`, {
            method: 'DELETE',
            credentials: 'include'
        });
        if (res.status !== 204 && res.status !== 200) throw new Error(await res.text());
    }

    function renderStats(data) {
        const total = data.length;
        const totalPrize = data.reduce((sum, e) => sum + Number(e.prize || 0), 0);
        const finished = data.filter(e => !isTBD(e.champion) && !isTBD(e.mvp));
        const uniqueMvp = [...new Set(finished.map(e => e.mvp))].filter(m => !isTBD(m));
        document.getElementById('statsGrid').innerHTML = `
            <div class="stat-card"><div class="label">总赛事</div><div class="value">${total}</div></div>
            <div class="stat-card"><div class="label">总奖金</div><div class="value">$${formatPrize(totalPrize)}</div></div>
            <div class="stat-card"><div class="label">已决出冠军</div><div class="value">${finished.length}<span class="unit">/ ${total}</span></div></div>
            <div class="stat-card"><div class="label">MVP 人数</div><div class="value">${uniqueMvp.length}</div></div>
        `;
    }

    function renderMVP(data) {
        const finished = data.filter(e => !isTBD(e.mvp));
        const counts = {};
        finished.forEach(e => {
            counts[e.mvp] = (counts[e.mvp] || 0) + 1;
        });
        const sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]);
        const medals = ['r1', 'r2', 'r3'];
        const list = document.getElementById('mvpList');
        if (sorted.length === 0) {
            list.innerHTML = '<div class="text-muted" style="padding:12px;">暂无 MVP 数据</div>';
            return;
        }
        list.innerHTML = sorted.map(([name, cnt], idx) => `
            <div class="mvp-item">
                <span class="mvp-left"><span class="medal ${medals[idx] || 'r'}">${idx < 3 ? '0' + (idx + 1) : String(idx + 1).padStart(2, '0')}</span><span class="name">${name}</span></span>
                <span class="count">${cnt} 次</span>
            </div>
        `).join('');
    }

    function renderTimeline(data) {
        const sorted = [...data].sort((a, b) => {
            const da = new Date(a.date);
            const db = new Date(b.date);
            return timelineOrder === 'desc' ? db - da : da - db;
        });
        const list = document.getElementById('timeline');
        list.innerHTML = sorted.map(e => {
            const isMajor = String(e.level || '').includes('Major');
            return `
                <div class="tl-item">
                    <span class="date">${formatDate(e.date)}</span>
                    <span class="event">${e.name}</span>
                    <span class="badge ${isMajor ? 'major' : ''}">${e.level}</span>
                </div>
            `;
        }).join('');
        const titleI = document.querySelector('.panel:nth-child(2) h3 i');
        if (titleI) titleI.textContent = timelineOrder === 'desc' ? '倒序' : '正序';
        const toggleBtn = document.getElementById('timelineToggle');
        if (toggleBtn) toggleBtn.textContent = timelineOrder === 'desc' ? '切换正序' : '切换倒序';
    }

    function renderChampionTeams(data) {
        const finished = data.filter(e => !isTBD(e.champion));
        const teamMap = {};
        finished.forEach(e => {
            const team = e.champion;
            if (!teamMap[team]) teamMap[team] = { count: 0, events: [] };
            teamMap[team].count++;
            teamMap[team].events.push({ name: e.name, date: e.date });
        });
        const sorted = Object.entries(teamMap)
            .map(([team, info]) => ({ team, ...info }))
            .sort((a, b) => b.count - a.count);

        const list = document.getElementById('championList');
        if (sorted.length === 0) {
            list.innerHTML = '<div class="text-muted" style="padding:12px;">暂无夺冠数据</div>';
            return;
        }

        list.innerHTML = sorted.map(item => {
            const eventItems = item.events.map(ev =>
                `<li><span class="event-name">${ev.name}</span><span class="event-date">${formatDate(ev.date)}</span></li>`
            ).join('');
            const key = item.team.replace(/\s/g, '');
            return `
                <div class="champion-item">
                    <span class="name">${item.team}</span>
                    <span style="display:flex;align-items:center;gap:6px;">
                        <span class="count">${item.count}</span>
                        <button class="expand-btn-sm" data-team="${item.team}">▶</button>
                    </span>
                    <ul class="champion-detail" id="detail-${key}">${eventItems}</ul>
                </div>
            `;
        }).join('');

        list.querySelectorAll('.expand-btn-sm').forEach(btn => {
            btn.addEventListener('click', function (e) {
                e.stopPropagation();
                const team = this.getAttribute('data-team');
                const key = team.replace(/\s/g, '');
                const detail = document.getElementById('detail-' + key);
                if (detail) {
                    const isVisible = detail.style.display !== 'block';
                    detail.style.display = isVisible ? 'block' : 'none';
                    this.textContent = isVisible ? '▼' : '▶';
                }
            });
        });
    }

    function syncSelectionUI() {
        document.querySelectorAll('.row-checkbox').forEach(cb => {
            cb.checked = selectedIds.has(Number(cb.dataset.id));
        });
        const visibleIds = filteredData.map(e => e.id);
        selectAll.checked = visibleIds.length > 0 && visibleIds.every(id => selectedIds.has(id));
    }

    function renderTable(data) {
        const sortedData = [...data].sort((a, b) => {
            const da = new Date(a.date);
            const db = new Date(b.date);
            return timelineOrder === 'desc' ? db - da : da - db;
        });

        if (sortedData.length === 0) {
            tableBody.innerHTML = `<tr><td colspan="10" style="text-align:center;padding:30px;color:#6a7f9e;">没有匹配的赛事</td></tr>`;
            syncSelectionUI();
            return;
        }

        let html = '';
        sortedData.forEach(e => {
            const isMvpTBD = isTBD(e.mvp);
            const isChampTBD = isTBD(e.champion);
            const hasDetail = Array.isArray(e.champion_roster) && e.champion_roster.length > 0;

            html += `
                <tr class="main-row" data-id="${e.id}">
                    <td>
                        <button class="expand-btn" data-id="${e.id}">▶</button>
                        <input type="checkbox" class="row-checkbox" data-id="${e.id}">
                    </td>
                    <td><strong>${e.name}</strong></td>
                    <td><span class="org-tag">${e.org}</span></td>
                    <td><span class="level-tag ${String(e.level || '').includes('Major') ? 'major' : ''}">${e.level}</span></td>
                    <td class="date-range">${formatDateRange(e)}</td>
                    <td class="location">${e.location || '未知'}</td>
                    <td class="prize">$${formatPrize(Number(e.prize || 0))}</td>
                    <td>${isChampTBD ? '<span class="text-muted">待定</span>' : e.champion}</td>
                    <td><span class="mvp-name ${isMvpTBD ? 'tbd' : ''}">${isMvpTBD ? '待定' : e.mvp}</span></td>
                    <td class="actions"><button class="edit-btn" data-id="${e.id}">编辑</button></td>
                </tr>
            `;

            let detailContent = '';
            if (hasDetail) {
                const championList = (e.champion_roster || []).join(', ');
                const runnerupList = (e.runnerup_roster || []).join(', ');
                const runnerupName = e.runnerup && !isTBD(e.runnerup) ? e.runnerup : '待定';
                detailContent = `
                    <div class="detail-content">
                        <div class="vs-line">
                            <span class="team-name"><span class="tag-win">WINNER</span>${e.champion}</span>
                            <span class="score">${e.score || '-'}</span>
                            <span class="team-name"><span class="tag-run">RUNNER</span>${runnerupName}</span>
                        </div>
                        <div class="roster-block">
                            <span class="roster-item"><strong>冠军阵容：</strong>${championList || '暂无'}</span>
                            <span class="roster-item"><strong>亚军阵容：</strong>${runnerupList || '暂无'}</span>
                        </div>
                    </div>
                `;
            } else {
                detailContent = `<div class="detail-content"><span class="text-muted">决赛尚未进行或信息暂缺</span></div>`;
            }

            html += `
                <tr class="detail-row" data-id="${e.id}" style="display:none;">
                    <td colspan="10">${detailContent}</td>
                </tr>
            `;
        });

        tableBody.innerHTML = html;
        syncSelectionUI();

        tableBody.querySelectorAll('.expand-btn').forEach(btn => {
            btn.addEventListener('click', function () {
                const id = this.getAttribute('data-id');
                const detailRow = tableBody.querySelector(`.detail-row[data-id="${id}"]`);
                if (detailRow) {
                    const isVisible = detailRow.style.display !== 'none';
                    detailRow.style.display = isVisible ? 'none' : 'table-row';
                    this.textContent = isVisible ? '▶' : '▼';
                }
            });
        });

        tableBody.querySelectorAll('.edit-btn').forEach(btn => {
            btn.addEventListener('click', function () {
                openEditModal(Number(this.getAttribute('data-id')));
            });
        });
    }

    function updateCharts(data) {
        const finished = data.filter(e => !isTBD(e.mvp));
        const mvpCounts = {};
        finished.forEach(e => {
            mvpCounts[e.mvp] = (mvpCounts[e.mvp] || 0) + 1;
        });
        const sortedMvp = Object.entries(mvpCounts).sort((a, b) => b[1] - a[1]);
        const labels = sortedMvp.map(item => item[0]);
        const values = sortedMvp.map(item => item[1]);

        const ctx1 = document.getElementById('mvpChart').getContext('2d');
        if (mvpChartInstance) mvpChartInstance.destroy();
        mvpChartInstance = new Chart(ctx1, {
            type: 'bar',
            data: {
                labels: labels.length ? labels : ['无数据'],
                datasets: [{
                    label: 'MVP 次数',
                    data: labels.length ? values : [0],
                    backgroundColor: '#5bc8ff',
                    borderRadius: 4,
                    barPercentage: 0.6,
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: true,
                plugins: { legend: { display: false } },
                scales: {
                    y: { beginAtZero: true, ticks: { stepSize: 1, color: '#8b97ab' }, grid: { color: 'rgba(255,255,255,0.06)' } },
                    x: { ticks: { color: '#9aa6bb', maxRotation: 30 } }
                }
            }
        });

        const orgPrize = {};
        data.forEach(e => {
            orgPrize[e.org] = (orgPrize[e.org] || 0) + Number(e.prize || 0);
        });
        const sortedOrg = Object.entries(orgPrize).sort((a, b) => b[1] - a[1]);
        const orgLabels = sortedOrg.map(item => item[0]);
        const orgValues = sortedOrg.map(item => item[1] / 1000000);

        const ctx2 = document.getElementById('orgPrizeChart').getContext('2d');
        if (orgChartInstance) orgChartInstance.destroy();
        orgChartInstance = new Chart(ctx2, {
            type: 'bar',
            data: {
                labels: orgLabels.length ? orgLabels : ['无数据'],
                datasets: [{
                    label: '总奖金 (百万 $)',
                    data: orgLabels.length ? orgValues : [0],
                    backgroundColor: '#8f6bff',
                    borderRadius: 4,
                    barPercentage: 0.6,
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: true,
                plugins: { legend: { display: false } },
                scales: {
                    y: { beginAtZero: true, ticks: { color: '#8b97ab' }, grid: { color: 'rgba(255,255,255,0.06)' } },
                    x: { ticks: { color: '#9aa6bb', maxRotation: 30 } }
                }
            }
        });
    }

    function renderAll(data) {
        renderStats(data);
        renderMVP(data);
        renderTimeline(data);
        renderChampionTeams(data);
        renderTable(data);
        updateCharts(data);
    }

    function applyFilters() {
        const org = orgFilter.value;
        const level = levelFilter.value;
        const month = monthFilter.value;

        filteredData = eventsData.filter(e => {
            const matchOrg = org === 'all' || e.org === org;
            const matchLevel = level === 'all' || e.level === level;
            const matchMonth = month === 'all' || (e.date && e.date.startsWith(month));
            const matchYear = e.date && e.date.startsWith(String(selectedYear));
            return matchOrg && matchLevel && matchMonth && matchYear;
        });

        renderAll(filteredData);
    }

    function populateFilters() {
        const orgs = ORG_OPTIONS;
        const levels = [...new Set(eventsData.map(e => e.level))].sort();
        const months = [...new Set(eventsData.filter(e => e.date && e.date.startsWith(String(selectedYear))).map(e => e.date.substring(0, 7)).filter(Boolean))].sort();

        const currentOrg = orgFilter.value;
        const currentLevel = levelFilter.value;
        const currentMonth = monthFilter.value;

        orgFilter.innerHTML = '<option value="all">全部</option>';
        orgs.forEach(o => {
            const opt = document.createElement('option');
            opt.value = o;
            opt.textContent = o;
            orgFilter.appendChild(opt);
        });

        levelFilter.innerHTML = '<option value="all">全部</option>';
        levels.forEach(l => {
            const opt = document.createElement('option');
            opt.value = l;
            opt.textContent = l;
            levelFilter.appendChild(opt);
        });

        monthFilter.innerHTML = '<option value="all">全部月份</option>';
        months.forEach(m => {
            const opt = document.createElement('option');
            opt.value = m;
            opt.textContent = m;
            monthFilter.appendChild(opt);
        });

        orgFilter.value = [...orgFilter.options].some(o => o.value === currentOrg) ? currentOrg : 'all';
        levelFilter.value = [...levelFilter.options].some(o => o.value === currentLevel) ? currentLevel : 'all';
        monthFilter.value = [...monthFilter.options].some(o => o.value === currentMonth) ? currentMonth : 'all';
    }

    function renderYearButtons() {
        const years = new Set(eventsData.map(e => {
            if (!e.date) return null;
            const y = Number(e.date.substring(0, 4));
            return Number.isFinite(y) ? y : null;
        }).filter(Boolean));
        years.add(selectedYear);
        const sortedYears = [...years].sort((a, b) => a - b);
        const bar = document.getElementById('yearBar');
        bar.innerHTML = sortedYears.map(year =>
            `<button class="year-btn ${year === selectedYear ? 'active' : ''}" data-year="${year}">${year}</button>`
        ).join('');
        bar.querySelectorAll('.year-btn').forEach(btn => {
            btn.addEventListener('click', function () {
                selectedYear = Number(this.dataset.year);
                renderYearButtons();
                populateFilters();
                applyFilters();
            });
        });
    }

    function exitDeleteMode() {
        deleteMode = false;
        document.body.classList.remove('delete-mode');
        const btn = document.getElementById('deleteBtn');
        btn.textContent = '删除比赛';
        btn.classList.remove('active');
    }

    function openAddModal() {
        editingId = null;
        document.getElementById('modalTitle').textContent = '添加比赛';
        document.getElementById('eventForm').reset();
        document.getElementById('eventId').value = '';
        document.getElementById('eventModal').style.display = 'flex';
    }

    function openEditModal(id) {
        const e = eventsData.find(item => item.id === id);
        if (!e) return;
        editingId = id;
        document.getElementById('modalTitle').textContent = '编辑比赛';
        document.getElementById('eventId').value = e.id;
        document.getElementById('name').value = e.name || '';
        document.getElementById('org').value = e.org || '';
        document.getElementById('level').value = e.level || '';
        document.getElementById('start_date').value = e.start_date || '';
        document.getElementById('end_date').value = e.end_date || '';
        document.getElementById('location').value = e.location || '';
        document.getElementById('prize').value = e.prize || '';
        document.getElementById('champion').value = e.champion || '';
        document.getElementById('runnerup').value = e.runnerup || '';
        document.getElementById('mvp').value = e.mvp || '';
        document.getElementById('score').value = e.score || '';
        document.getElementById('champion_roster').value = (e.champion_roster || []).join(', ');
        document.getElementById('runnerup_roster').value = (e.runnerup_roster || []).join(', ');
        document.getElementById('eventModal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('eventModal').style.display = 'none';
        editingId = null;
    }

    function parseRoster(text) {
        return text.split(',').map(s => s.trim()).filter(Boolean);
    }

    function parseNullable(text) {
        const v = text.trim();
        return v === '' ? null : v;
    }

    async function submitEvent(e) {
        e.preventDefault();
        const payload = {
            name: document.getElementById('name').value.trim(),
            org: document.getElementById('org').value.trim(),
            level: document.getElementById('level').value.trim(),
            start_date: document.getElementById('start_date').value,
            end_date: document.getElementById('end_date').value,
            location: document.getElementById('location').value.trim(),
            prize: Number(document.getElementById('prize').value),
            champion: parseNullable(document.getElementById('champion').value),
            runnerup: parseNullable(document.getElementById('runnerup').value),
            mvp: parseNullable(document.getElementById('mvp').value),
            score: parseNullable(document.getElementById('score').value),
            champion_roster: parseRoster(document.getElementById('champion_roster').value),
            runnerup_roster: parseRoster(document.getElementById('runnerup_roster').value)
        };

        if (!payload.name || !payload.org || !payload.level || !payload.start_date || !payload.end_date || !payload.location || Number.isNaN(payload.prize)) {
            alert('请填写所有必填字段，并确保奖金为数字。');
            return;
        }

        try {
            if (editingId === null) {
                await createEvent(payload);
            } else {
                await updateEvent(editingId, payload);
            }
            closeModal();
            eventsData = await fetchEvents();
            renderYearButtons();
            populateFilters();
            applyFilters();
            await refreshLastModified();
        } catch (err) {
            alert('保存失败：' + err.message);
        }
    }

    async function init() {
        try {
            eventsData = await fetchEvents();
            renderYearButtons();
            populateFilters();
            applyFilters();
            await refreshLastModified();
        } catch (err) {
            document.getElementById('statsGrid').innerHTML = `
                <div class="stat-card"><div class="label">连接失败</div><div class="value" style="font-size:16px;">请先启动后端：uvicorn main:app --reload --port 8000</div></div>
            `;
            alert('无法连接后端服务：' + err.message);
        }
    }

    document.getElementById('addBtn').addEventListener('click', openAddModal);
    document.getElementById('deleteBtn').addEventListener('click', async function () {
        if (!deleteMode) {
            deleteMode = true;
            document.body.classList.add('delete-mode');
            this.textContent = '确认删除';
            this.classList.add('active');
            renderTable(filteredData);
            return;
        }

        if (selectedIds.size === 0) {
            alert('请至少选择一项');
            return;
        }

        const names = [];
        selectedIds.forEach(id => {
            const ev = eventsData.find(item => item.id === id);
            if (ev) names.push(`${ev.name} (ID:${id})`);
        });
        if (!confirm(`确认删除以下赛事？\n${names.join('\n')}`)) return;

        try {
            await Promise.all([...selectedIds].map(id => deleteEvent(id)));
            eventsData = await fetchEvents();
            selectedIds.clear();
            renderYearButtons();
            populateFilters();
            exitDeleteMode();
            applyFilters();
            await refreshLastModified();
            alert('删除成功！');
        } catch (err) {
            alert('删除失败：' + err.message);
        }
    });

    document.getElementById('cancelDeleteBtn').addEventListener('click', function () {
        selectedIds.clear();
        exitDeleteMode();
        renderTable(filteredData);
    });

    document.getElementById('cancelBtn').addEventListener('click', closeModal);
    document.getElementById('cancelBtn2').addEventListener('click', closeModal);
    document.getElementById('eventForm').addEventListener('submit', submitEvent);
    document.getElementById('eventModal').addEventListener('click', function (e) {
        if (e.target === this) closeModal();
    });

    selectAll.addEventListener('change', function () {
        const visibleIds = filteredData.map(item => item.id);
        if (this.checked) {
            visibleIds.forEach(id => selectedIds.add(id));
        } else {
            visibleIds.forEach(id => selectedIds.delete(id));
        }
        syncSelectionUI();
    });

    tableBody.addEventListener('change', function (e) {
        if (e.target.classList.contains('row-checkbox')) {
            const id = Number(e.target.dataset.id);
            if (e.target.checked) selectedIds.add(id);
            else selectedIds.delete(id);
            syncSelectionUI();
        }
    });

    document.getElementById('timelineToggle').addEventListener('click', function () {
        timelineOrder = timelineOrder === 'desc' ? 'asc' : 'desc';
        renderAll(filteredData);
    });

    orgFilter.addEventListener('change', applyFilters);
    levelFilter.addEventListener('change', applyFilters);
    monthFilter.addEventListener('change', applyFilters);
    document.getElementById('resetFilters').addEventListener('click', function () {
        orgFilter.value = 'all';
        levelFilter.value = 'all';
        monthFilter.value = 'all';
        applyFilters();
    });

    const loginOverlay = document.getElementById('loginOverlay');
    let adminReady = false;

    async function checkAdminSession() {
        try {
    const res = await fetch(`${API_BASE}/api/admin/check`, { credentials: 'include' });
            if (res.ok) {
                const data = await res.json();
                return data.authenticated === true;
            }
        } catch (e) {}
        return false;
    }

    async function handleLogin() {
        const pw = document.getElementById('loginPassword').value;
        if (!pw) return;
        const btn = document.getElementById('loginBtn');
        btn.disabled = true;
        btn.textContent = '验证中...';
        try {
    const res = await fetch(`${API_BASE}/api/admin/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: pw }),
                credentials: 'include'
            });
            if (res.ok) {
                document.getElementById('loginError').textContent = '';
                loginOverlay.classList.add('hidden');
                if (!adminReady) {
                    adminReady = true;
                    init();
                }
            } else {
                const data = await res.json().catch(() => ({}));
                document.getElementById('loginError').textContent = data.detail || '密码错误，请重试';
                document.getElementById('loginPassword').value = '';
            }
        } catch (e) {
            document.getElementById('loginError').textContent = '网络错误，请重试';
        } finally {
            btn.disabled = false;
            btn.textContent = '进入控制台';
        }
    }

    document.getElementById('loginBtn').addEventListener('click', handleLogin);
    document.getElementById('loginPassword').addEventListener('keydown', function (e) {
        if (e.key === 'Enter') handleLogin();
    });

    (async function () {
        if (await checkAdminSession()) {
            loginOverlay.classList.add('hidden');
            adminReady = true;
            init();
        }
    })();


    </script>
    </body>
</html>
